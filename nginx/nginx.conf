events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    upstream backend_api {
        server api:8000;
    }

    upstream frontend_ui {
        server dashboard:8501;
    }

    upstream fastapi_backend {
        server api:8000;
    }

    upstream streamlit_frontend {
        server dashboard:8501;
    }

    server {
        listen 80;
        server_name _;
        add_header X-Frame-Options "SAMEORIGIN";

        # 1. FastAPI REST & Documentation Endpoints
        location ~ ^/(api|health|metadata|docs|openapi.json|predict) {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        # 2. WebSocket Endpoints (Upgrade Headers)
        location /ws/ {
            proxy_pass http://fastapi_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 3. Streamlit WebSocket Streaming
        location /_stcore/stream {
            proxy_pass http://streamlit_frontend/_stcore/stream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
        }

        # 4. Streamlit Dashboard Frontend
        location / {
            proxy_pass http://streamlit_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
